[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-agent"
version = "0.1.0"
description = "Indian Stock Market Multi-Agent Trading System using CrewAI + Gemini 2.0 Flash"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "crewai>=0.80.0",
    "crewai-tools>=0.15.0",
    "google-generativeai>=0.8.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "kiteconnect>=5.0.1",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "pytz>=2024.2",
    "yfinance>=1.2.0",
    "ta>=0.11.0",
    "psycopg2-binary>=2.9.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "tenacity>=9.0.0",
    "gnews>=0.3.7",
    "tavily-python>=0.5.0",
    "rich>=13.9.0",
    "typer>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "httpx>=0.27.0",
]
ollama = [
    "langchain-ollama>=0.2.0",
]

[project.scripts]
stock-agent = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]
